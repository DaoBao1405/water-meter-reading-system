services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meter
      POSTGRES_USER: meter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meter_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meter -d meter"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://meter:${POSTGRES_PASSWORD:-meter_dev_password}@postgres:5432/meter
      MODEL_DEVICE: ${MODEL_DEVICE:-cpu}
      EXPECTED_DIGIT_COUNT: ${EXPECTED_DIGIT_COUNT:-4}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
